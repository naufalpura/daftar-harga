<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Daftar Harga Produk</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Bootstrap & DataTables CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/v/bs4/dt-1.10.18/datatables.min.css" />
    <!-- Lucide Icons for arrow -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      :root {
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-bg: #eff6ff;
        --danger: #dc2626;
        --border-color: #e2e8f0;
      }

      body {
        background-color: var(--bg-color);
        font-family: "Inter", sans-serif;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
        padding-bottom: 50px;
      }

      .app-container {
        max-width: 600px; /* Lebih ramping untuk tampilan ala aplikasi mobile */
        margin: 0 auto;
        padding: 15px;
      }

      .page-header {
        text-align: center;
        margin-bottom: 20px;
        padding: 10px 0;
      }
      .page-header h3 {
        font-weight: 800;
        font-size: 1.5rem;
        letter-spacing: -0.5px;
        margin-bottom: 4px;
      }
      .page-header p {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      /* Search Box Modern & Responsive */
      .dataTables_filter {
        width: 100%;
        text-align: left !important;
      }
      .dataTables_filter label {
        width: 100%;
      }
      .dataTables_filter input {
        width: 100% !important;
        margin: 0 0 15px 0 !important;
        padding: 14px 20px !important;
        border: 2px solid var(--border-color) !important;
        border-radius: 12px !important;
        font-size: 1rem !important;
        font-weight: 600;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        transition: all 0.2s ease;
      }
      .dataTables_filter input:focus {
        border-color: var(--primary) !important;
        background: #fff;
        outline: none;
      }

      /* DataTables Layout */
      #example thead { display: none; }
      .table td { padding: 0; border: none !important; }
      table.dataTable {
        border-collapse: separate !important;
        border-spacing: 0 8px !important;
      }

      /* Product Card */
      .product-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        overflow: hidden;
        transition: transform 0.1s ease;
      }
      
      .card-header-toggle {
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        gap: 10px;
      }
      
      .card-header-toggle:active {
        background-color: #f1f5f9;
      }

      .name-section {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
        min-width: 0; /* Penting untuk text-overflow */
      }

      .chevron-icon {
        color: var(--text-muted);
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        transition: transform 0.3s ease;
      }
      .product-card.active .chevron-icon {
        transform: rotate(180deg);
        color: var(--primary);
      }

      .prod-name {
        font-weight: 700;
        font-size: 0.95rem;
        text-transform: uppercase;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .main-price-tag {
        font-weight: 800;
        color: var(--danger);
        font-size: 1rem;
        flex-shrink: 0;
      }

      /* Content Area */
      .card-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        background-color: #fafbfc;
      }
      .product-card.active .card-content {
        max-height: 2000px;
        border-top: 1px solid #f1f5f9;
      }

      .variations-container {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .variation-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background-color: #fff;
        border: 1px solid #f1f5f9;
        border-radius: 10px;
      }

      .prod-satuan {
        background-color: var(--primary-bg);
        color: var(--primary);
        font-weight: 700;
        font-size: 0.65rem;
        padding: 2px 8px;
        border-radius: 5px;
        text-transform: uppercase;
      }

      .prod-isi {
        color: var(--text-muted);
        font-family: "Roboto Mono", monospace;
        font-size: 0.7rem;
      }

      .v-price {
        font-weight: 700;
        color: var(--text-main);
        font-size: 0.9rem;
      }

      /* Mobile Adjustment */
      @media (max-width: 480px) {
        .app-container { padding: 10px; }
        .page-header h3 { font-size: 1.3rem; }
        .card-header-toggle { padding: 12px; }
        .prod-name { font-size: 0.85rem; }
        .main-price-tag { font-size: 0.95rem; }
        
        .variation-row {
            flex-direction: row; /* Tetap row jika muat */
            font-size: 0.85rem;
        }
      }

      /* Pagination Styling */
      .dataTables_info {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        text-align: center;
        padding: 15px 0;
      }
      .pagination {
        justify-content: center;
      }
      .page-link {
        padding: 8px 14px;
        font-size: 0.8rem;
        border-radius: 8px !important;
        margin: 0 2px;
        border: none;
        background: #fff;
        color: var(--text-main);
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
      .page-item.active .page-link {
        background-color: var(--primary);
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <div class="page-header">
        <h3>DAFTAR HARGA</h3>
        <p>Sentuh nama produk untuk detail variasi</p>
      </div>

      <table id="example" class="table" width="100%">
        <thead><tr><th>Data</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.datatables.net/v/bs4/dt-1.10.18/datatables.min.js"></script>

    <script>
      function formatIDR(val) {
        if (val === 0) return "Tanya Harga";
        return "Rp " + new Intl.NumberFormat("id-ID").format(val);
      }

      $(document).ready(function () {
        $("#example").DataTable({
          ajax: {
            url: "https://script.google.com/macros/s/AKfycbxMZKsplbUsrvDkP5LLXcLVFSamfHYtmr2lnRqgb6S0-SOtqP0a9M3xu47lXBZrM3Dnpw/exec?action=getData",
            dataSrc: function (json) {
              const groupedData = {};
              json.forEach((row) => {
                const nama = row[1] || "Tanpa Nama";
                let rawHarga = row[5] ? String(row[5]).replace(/[^0-9]/g, "") : "0";
                let hargaNum = parseInt(rawHarga) || 0;

                if (!groupedData[nama]) {
                  groupedData[nama] = { nama: nama, variations: [] };
                }
                groupedData[nama].variations.push({
                  satuan: row[3] || "-",
                  isi: row[4] || "-",
                  harga: hargaNum,
                });
              });
              return Object.values(groupedData);
            },
          },
          columns: [
            {
              data: null,
              render: function (data) {
                // Logika Harga Utama: Pcs > Harga terkecil > Harga pertama
                let mainVariation = data.variations.find(v => v.satuan.toLowerCase() === 'pcs');
                if (!mainVariation) mainVariation = data.variations[0];

                let variationsHtml = '';
                data.variations.forEach((v) => {
                  variationsHtml += `
                    <div class="variation-row">
                      <div class="d-flex align-items-center" style="gap:6px">
                        <span class="prod-satuan">${v.satuan}</span>
                        <span class="prod-isi">isi: ${v.isi}</span>
                      </div>
                      <div class="v-price">${formatIDR(v.harga)}</div>
                    </div>
                  `;
                });

                return `
                <div class="product-card">
                  <div class="card-header-toggle">
                    <div class="name-section">
                      <i data-lucide="chevron-down" class="chevron-icon"></i>
                      <div class="prod-name">${data.nama}</div>
                    </div>
                    <div class="main-price-tag">${formatIDR(mainVariation.harga)}</div>
                  </div>
                  <div class="card-content">
                    <div class="variations-container">
                      ${variationsHtml}
                    </div>
                  </div>
                </div>`;
              },
            },
          ],
          order: [[0, "asc"]],
          displayLength: 50,
          drawCallback: function() {
            lucide.createIcons();
          },
          language: {
            search: "",
            searchPlaceholder: "🔍 Cari nama barang...",
            info: "_TOTAL_ Barang ditemukan",
            paginate: { previous: "Prev", next: "Next" },
          }
        });

        // Click handler untuk mobile-friendly
        $('#example').on('click', '.card-header-toggle', function() {
          const card = $(this).closest('.product-card');
          card.toggleClass('active');
        });
      });
    </script>
  </body>
</html>
